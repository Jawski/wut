<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolidy — WUT Racing</title>
    <meta name="description" content="Wszystkie generacje bolidów WUT Racing — od WUT-1 do WUT-7.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="cars">

    <section class="hero hero-photo-mode">
        <div class="hero-carousel" id="hero-carousel">

            <div class="hero-slide is-active" data-slide="0">
                <div class="hero-photo">
                    <img src="assets/cars-1.jpg" alt="Bolid WUT Racing">
                </div>
                <div class="hero-photo-overlay"></div>
                <div class="hero-photo-content">
                    <h1 class="hero-photo-headline" data-i18n="cars.hero1">Siedem generacji<br>jedno DNA</h1>
                    <a href="#cars-start" class="hero-discover">
                        <span data-i18n="cars.heroCta">Zobacz oś czasu</span> <span class="disc-arrow">→</span>
                    </a>
                </div>
            </div>

            <div class="hero-slide" data-slide="1">
                <div class="hero-photo">
                    <img src="assets/cars-2.jpg" alt="Bolid WUT Racing na torze" loading="lazy">
                </div>
                <div class="hero-photo-overlay"></div>
                <div class="hero-photo-content">
                    <h1 class="hero-photo-headline" data-i18n="cars.hero2">Inżynieria<br>w detalu</h1>
                    <a href="#cars-start" class="hero-discover">
                        <span data-i18n="cars.heroCta2">Wybierz bolid</span> <span class="disc-arrow">→</span>
                    </a>
                </div>
            </div>

        </div>

        <div class="hero-dots" id="hero-dots">
            <button class="hero-dot is-active" data-go="0" aria-label="Slajd 1"></button>
            <button class="hero-dot" data-go="1" aria-label="Slajd 2"></button>
        </div>

    </section>

    <span id="cars-start"></span>
    <section class="cars-timeline-section">
        <div class="cars-timeline-head">
            <span class="eyebrow" data-i18n="cars.timelineEyebrow">Oś czasu</span>
            <h2 class="h-1" style="margin-top: 12px;" data-i18n="cars.timelineTitle">Wybierz <span class="text-accent">generację</span>.</h2>
        </div>
        <div class="cars-timeline" id="cars-timeline">
            <div class="cars-timeline-line"></div>
            <div class="cars-timeline-track" id="cars-timeline-track"></div>
        </div>
    </section>

    <section class="car-show-section" id="active-car-panel"></section>

    <script src="js/i18n.js"></script>
    <script type="module" src="js/cars.js"></script>
    <script src="js/common.js"></script>
    <script src="js/animations.js"></script>
</body>
</html>
