<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zespół — WUT Racing</title>
    <meta name="description" content="Poznaj zespół WUT Racing — inżynierów, kierowców i menedżerów Politechniki Warszawskiej.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="team">

    <!-- hero -->
    <section class="hero hero-photo-mode">
        <div class="hero-carousel" id="hero-carousel">

            <div class="hero-slide is-active" data-slide="0">
                <div class="hero-photo">
                    <img src="assets/team-1.jpg" alt="Zespół WUT Racing">
                </div>
                <div class="hero-photo-overlay"></div>
                <div class="hero-photo-content">
                    <h1 class="hero-photo-headline" data-i18n="team.hero1">Twarze za<br>bolidem</h1>
                    <p class="hero-photo-sub"><span id="team-total">90</span></p>
                    <a href="#team-start" class="hero-discover">
                        <span data-i18n="team.heroCta">Poznaj skład</span> <span class="disc-arrow">→</span>
                    </a>
                </div>
            </div>

            <div class="hero-slide" data-slide="1">
                <div class="hero-photo">
                    <img src="assets/team-2.jpg" alt="WUT Racing przy pracy" loading="lazy">
                </div>
                <div class="hero-photo-overlay"></div>
                <div class="hero-photo-content">
                    <h1 class="hero-photo-headline" data-i18n="team.hero2">Każdy ma<br>swoją rolę</h1>
                    <a href="#team-start" class="hero-discover">
                        <span data-i18n="team.heroCta2">Filtruj po działach</span> <span class="disc-arrow">→</span>
                    </a>
                </div>
            </div>

            <div class="hero-slide" data-slide="2">
                <div class="hero-photo">
                    <img src="assets/team-3.jpg" alt="WUT Racing — kierowcy" loading="lazy">
                </div>
                <div class="hero-photo-overlay"></div>
                <div class="hero-photo-content">
                    <h1 class="hero-photo-headline" data-i18n="team.hero3">Jeden<br>cel</h1>
                    <a href="#team-start" class="hero-discover">
                        <span data-i18n="team.heroCta">Poznaj skład</span> <span class="disc-arrow">→</span>
                    </a>
                </div>
            </div>

        </div>

        <div class="hero-dots" id="hero-dots">
            <button class="hero-dot is-active" data-go="0" aria-label="Slajd 1"></button>
            <button class="hero-dot" data-go="1" aria-label="Slajd 2"></button>
            <button class="hero-dot" data-go="2" aria-label="Slajd 3"></button>
        </div>

    </section>

    <div id="team-start"></div>
    <div class="team-filter" id="team-filter"></div>

    <section>
        <div class="team-grid" id="team-grid"></div>
    </section>

    <script src="js/i18n.js"></script>
    <script src="js/team-data.js"></script>
    <script src="js/team.js"></script>
    <script src="js/common.js"></script>
    <script src="js/animations.js"></script>
</body>
</html>
